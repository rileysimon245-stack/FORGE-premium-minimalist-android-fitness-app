name: Build FORGE APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'FORGE_for_build.zip'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          unzip -o FORGE_for_build.zip -d extracted
          find extracted -name settings.gradle.kts -print

      - name: Build APK
        run: |
          cd extracted/FORGE
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FORGE-debug-APK
          path: extracted/FORGE/app/build/outputs/apk/debug/*.apk
