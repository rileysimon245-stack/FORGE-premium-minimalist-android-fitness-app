name: Build FORGE APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q FORGE.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle -p FORGE assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: FORGE-debug-apk
          path: FORGE/app/build/outputs/apk/debug/*.apk
